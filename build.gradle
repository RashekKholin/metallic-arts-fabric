plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }

repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods { metallicarts { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
fabricApi {
    configureDataGeneration { client = true }
    configureTests {
        createSourceSet = true
        modId = 'metallicarts-test'
        enableGameTests = true
        enableClientGameTests = true
        // User approved accepting the EULA for local tests. Other developers opt in explicitly.
        eula = providers.gradleProperty('acceptMinecraftEula').map { it.toBoolean() }.getOrElse(false)
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
processResources { exclude '**/.gitkeep', '**/README.md' }
sourceSets.main.resources.exclude 'assets/metallicarts/textures/**/*.png'
processResources { from(zipTree('src/main/texture-assets.zip')) }
tasks.named('sourcesJar') { mustRunAfter 'runDatagen' }

loom.runs {
    multiplayerServer {
        server(); source sourceSets.gametest; runDir providers.gradleProperty('multiplayerRunRoot').getOrElse('build/run')+'/multiplayerServer'
        vmArg '-Dmetallicarts.multiplayer=server'; vmArg "-Dmetallicarts.soakTicks=${providers.gradleProperty('soakTicks').getOrElse('1200')}"; programArg 'nogui'
    }
    ['A','B'].each { role ->
        create("multiplayerClient${role}") {
            client(); source sourceSets.gametest; runDir providers.gradleProperty('multiplayerRunRoot').getOrElse('build/run')+"/multiplayerClient${role}"
            vmArg "-Dmetallicarts.multiplayer=${role}"
            programArgs '--username', "MetalTest${role}", '--width', '854', '--height', '480'
        }
    }
    restartSmoke {
        server()
        source sourceSets.gametest
        runDir providers.gradleProperty('smokeRunDir').getOrElse('build/run/restartSmoke')
        vmArg "-Dmetallicarts.restartSmoke=${providers.gradleProperty('smokeMode').getOrElse('verify')}"
        programArg 'nogui'
    }
}

jar { from('LICENSE') { rename { 'LICENSE_metallicarts' } } }

// Optional isolated compatibility fixture. Never bundles or installs third-party mods for normal users.
if (providers.gradleProperty('claimsIntegrationTest').isPresent()) {
    def claimsDir=providers.gradleProperty('claimsModsDir').getOrElse('../../work/compat-mods')
    dependencies { gametestRuntimeOnly files(claimsDir+'/openpac.jar',claimsDir+'/configport.jar') }
}

tasks.named('sourcesJar') { from('LICENSE') }
