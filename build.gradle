plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }

repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods { metallicarts { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
fabricApi {
    configureDataGeneration { client = true }
    configureTests {
        createSourceSet = true
        modId = 'metallicarts-test'
        enableGameTests = true
        enableClientGameTests = true
        // User approved accepting the EULA for local tests. Other developers opt in explicitly.
        eula = providers.gradleProperty('acceptMinecraftEula').map { it.toBoolean() }.getOrElse(false)
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
processResources { exclude '**/.gitkeep', '**/README.md' }
tasks.named('sourcesJar') { mustRunAfter 'runDatagen' }
