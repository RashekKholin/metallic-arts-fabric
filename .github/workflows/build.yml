name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew clean build runDatagen -x runGameTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metallicarts-build
          path: |
            build/libs/*.jar
            build/reports/tests/test/
