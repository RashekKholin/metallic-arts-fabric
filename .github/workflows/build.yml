name: Build and acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew clean build runDatagen -x runGameTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: metallicarts-build
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: build/reports/tests/test/
  server-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Native dedicated-server tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew runGameTest -PacceptMinecraftEula=true --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-evidence-${{ matrix.os }}
          path: |
            build/run/gameTest/logs/
            build/reports/
  compatibility-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Download pinned official compatibility fixture
        shell: pwsh
        run: ./scripts/setup-claim-fixture.ps1 -Destination "$env:RUNNER_TEMP/claims"
      - name: Actual claim-mod integration
        run: ./gradlew runGameTest -PclaimsIntegrationTest=true -PclaimsModsDir="$RUNNER_TEMP/claims" -PacceptMinecraftEula=true --console=plain
      - name: Orderly reload and intentional partial-save crash recovery
        shell: pwsh
        run: ./scripts/verify-save-recovery.ps1 -AcceptMinecraftEula
      - name: Historical save upgrades
        shell: pwsh
        run: ./scripts/verify-legacy-migration.ps1 -AcceptMinecraftEula
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-recovery-evidence
          path: |
            build/run/recovery-*/**/*.log
            build/run/recovery-*/**/*.result
            build/legacy-*/world-*/*.log
            build/legacy-*/world-*/*.result
  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Native client tests under a software-rendered display
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew runClientGameTest -PacceptMinecraftEula=true --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-evidence-linux
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, server-tests, compatibility-recovery, client-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: metallicarts-build
          path: dist
      - name: Publish immutable versioned candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing release retained: $tag"
          else
            (cd dist && sha256sum *.jar > SHA256SUMS)
            gh release create "$tag" dist/*.jar dist/SHA256SUMS \
              --target "$GITHUB_SHA" --prerelease --title "The Metallic Arts $version" \
              --notes-file docs/RELEASE_NOTES.md
          fi
