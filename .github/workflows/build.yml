name: Build and test
on: [push, pull_request]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew clean build runDatagen -x runGameTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metallicarts-build
          path: |
            build/libs/*.jar
            build/reports/tests/test/
      - name: Publish versioned alpha download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing release retained: $tag"
          else
            sha256sum build/libs/*.jar > build/libs/SHA256SUMS
            gh release create "$tag" build/libs/*.jar build/libs/SHA256SUMS \
              --target "$GITHUB_SHA" --prerelease --title "The Metallic Arts $version" \
              --notes-file docs/RELEASE_NOTES.md
          fi


